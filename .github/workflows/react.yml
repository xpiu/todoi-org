name: React app

# The React rebuild lives in todoi-org-react/; this runs when it changes.
#
# TEMP(json-store): the app serves its seed files (todoi-org-react/packages/db/seed/*.json)
# and connects to no database, so this job starts none. The PostgreSQL service and its
# addresses are commented out below, not removed: todoi-org-react/docs/json-store.md is
# the way back. Without them the PostgreSQL-only tests (the parked editor) do not run here.
on:
  push:
    branches: [main]
    paths: ['todoi-org-react/**', '.github/workflows/react.yml']
  pull_request:
    paths: ['todoi-org-react/**', '.github/workflows/react.yml']

permissions:
  contents: read

concurrency:
  group: react-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    # The app's commands run in its folder; the deploy job has no checkout and needs none.
    defaults:
      run:
        working-directory: todoi-org-react
    timeout-minutes: 30
    # TEMP(json-store): back with PostgreSQL.
    # services:
    #   postgres:
    #     image: postgres:18
    #     env:
    #       POSTGRES_USER: todoi
    #       POSTGRES_PASSWORD: todoi
    #       POSTGRES_DB: todoi
    #     ports: ['5432:5432']
    #     options: >-
    #       --health-cmd "pg_isready -U todoi -d todoi"
    #       --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # TEMP(json-store): back with PostgreSQL.
      # DATABASE_URL: postgres://todoi:todoi@localhost:5432/todoi
      # TEST_DATABASE_URL: postgres://todoi:todoi@localhost:5432/todoi_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: todoi-org-react/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: todoi-org-react/package.json
          cache: pnpm
          cache-dependency-path: todoi-org-react/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Typecheck, lint, unit tests. TEMP(json-store): the integration tests against
      # PostgreSQL are left out while TEST_DATABASE_URL is unset (vitest.config.ts).
      - run: pnpm check

      - run: pnpm build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Runs the production build. TEMP(json-store): it serves the seed files; with
      # PostgreSQL back, against a freshly seeded test database.
      - run: pnpm e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: todoi-org-react/playwright-report
          retention-days: 7

  deploy:
    name: Deploy to the VPS
    needs: check
    # Only a push to main of this repository: never a pull request, never a fork
    # (whose runs have no access to the secret anyway). Skipped until the secret exists.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xpiu/todoi-org'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Ask Dokploy to pull and build
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          # Through the environment, never into the script: a commit message is free text.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "::notice::DOKPLOY_DEPLOY_WEBHOOK is not set yet; nothing deployed."
            exit 0
          fi
          # Dokploy's webhook deploys only for what looks like a GitHub push to the
          # application's branch: the X-GitHub-Event header and a matching `ref`. A bare
          # POST is answered 301 "Branch Not Match" and nothing is deployed. `commits`
          # satisfies the application's Watch Paths (todoi-org-react/**); this workflow
          # is already filtered to those paths, so one path under it is enough.
          payload=$(jq -n --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" --arg message "$COMMIT_MESSAGE" \
            '{ref: $ref, head_commit: {id: $sha, message: $message}, commits: [{modified: ["todoi-org-react/Dockerfile"]}]}')
          # Dokploy refuses with a 301, which `curl --fail` lets through: only a 200 is a deploy.
          status=$(curl --silent --show-error --max-time 30 \
            --output "$RUNNER_TEMP/dokploy.json" --write-out '%{http_code}' \
            -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'X-GitHub-Event: push' -H 'Content-Type: application/json' \
            --data "$payload")
          cat "$RUNNER_TEMP/dokploy.json"; echo
          if [ "$status" != 200 ]; then
            echo "::error::Dokploy answered $status; nothing deployed."
            exit 1
          fi
