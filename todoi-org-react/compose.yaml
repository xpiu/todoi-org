# TEMP(json-store): NOT NEEDED TO RUN THE SITE. The site serves the seed files
# (packages/db/seed/*.json) and connects to no database; see docs/json-store.md.
# This stays for the parked PostgreSQL code: its tests
# (TEST_DATABASE_URL=... pnpm test) and the `pnpm db:*` scripts.
#
# Local PostgreSQL. Port 5434 on the host: 5432 and 5433 are held by Postgres.app
# for other projects on the development machine.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: todoi
      POSTGRES_PASSWORD: todoi
      POSTGRES_DB: todoi
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - todoi-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoi -d todoi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  todoi-pg:
