# TLS is terminated by Dokploy's Traefik; this container only speaks plain HTTP on :80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/csv text/xml application/javascript application/xml image/svg+xml;
    server_tokens off;

    # Behind a proxy: keep redirects relative so they don't point at http://<container>:80.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv text/xml application/javascript application/json application/ld+json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The dataset. nginx's stock mime.types has no CSV entry.
    location ~* \.csv$ {
        types { }
        default_type "text/csv";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML, CSS, JS and text files aren't fingerprinted: revalidate every time (ETag makes it cheap).
    location ~* \.(?:html|css|js|txt|xml)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # Fonts, icons and images rarely change.
    location ~* \.(?:woff2|webp|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
