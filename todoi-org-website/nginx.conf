# TLS is terminated by Dokploy's Traefik; this container only speaks plain HTTP on :80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/csv text/xml application/javascript application/xml image/svg+xml;
    server_tokens off;

    # Behind a proxy: keep redirects relative so they don't point at http://<container>:80.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/csv text/xml application/javascript application/json application/ld+json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Sent over plain HTTP here, but Traefik passes it through on HTTPS, which is
    # the only place browsers honour it. No includeSubDomains: other subdomains
    # aren't ours to promise for.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # One URL per page: /index.html and /dir/index.html are the directory URLs.
    # $request_uri is the address as asked, so the index directive's internal
    # rewrite to index.html doesn't loop through here.
    if ($request_uri ~ "^([^?]*/)index\.html(\?.*)?$") {
        return 301 $1$2;
    }

    # Serve the .gz files the Dockerfile compresses at build time, instead of
    # compressing the 2 MB commercial page on every request.
    gzip_static on;

    location / {
        try_files $uri $uri/ =404;
    }

    # The dataset. nginx's stock mime.types has no CSV entry.
    location ~* \.csv$ {
        types { }
        default_type "text/csv";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # HTML, CSS, JS and text files aren't fingerprinted: revalidate every time (ETag makes it cheap).
    location ~* \.(?:html|css|js|txt|xml)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    # Fonts, icons and images rarely change.
    location ~* \.(?:woff2|webp|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    # The precompressed copies are an implementation detail of gzip_static, which
    # reads them off disk; they aren't addresses of their own.
    location ~ \.gz$ {
        return 404;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
